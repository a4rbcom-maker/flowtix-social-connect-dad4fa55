name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build Frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_EXTRACTION_API_URL: ${{ secrets.VITE_EXTRACTION_API_URL }}
          VITE_EXTRACTION_API_KEY: ${{ secrets.VITE_EXTRACTION_API_KEY }}
        run: npm run build
      - name: Delete old files on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            chmod 777 /www/wwwroot/flowtixtools.com/.user.ini 2>/dev/null; true
            rm -rf /www/wwwroot/flowtixtools.com/*
            rm -rf /www/wwwroot/flowtixtools.com/.[!.]* 2>/dev/null; true
      - name: Deploy to Server
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr
          path: dist/
          remote_path: /www/wwwroot/flowtixtools.com
          remote_host: ${{ secrets.SERVER_IP }}
          remote_port: ${{ secrets.SSH_PORT }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
